name: Deploy

# Manual only, by deliberate choice. Deploying production is an explicit act, not
# a side effect of merging: a merge would otherwise build two multi-GB images and
# push to a live Render service without anyone watching. Run it from
# Actions -> Deploy -> Run workflow.
on:
  workflow_dispatch:

# Two overlapping runs must never deploy concurrently to the same Render services.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WEB_IMAGE: ghcr.io/lavela-health/cal-web
  API_IMAGE: ghcr.io/lavela-health/cal-api

jobs:
  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The web image is multi-GB and the default runner ships ~14GB free.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          # No real secret is needed to build. DATABASE_URL / NEXTAUTH_SECRET /
          # CALENDSO_ENCRYPTION_KEY are consumed only by `prisma generate` and
          # Next.js module-load checks, never baked into the bundle.
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://cal.lavelahealth.com
            NEXT_PUBLIC_WEBSITE_URL=https://cal.lavelahealth.com
            NEXT_PUBLIC_APP_NAME=Lavela Cal
            NEXT_PUBLIC_COMPANY_NAME=Lavela Health
            NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=hello@lavelahealth.com
            NEXT_PUBLIC_EMBED_LIB_URL=https://cal.lavelahealth.com/embed/embed.js
            NEXT_PUBLIC_MINUTES_TO_BOOK=5
            NEXT_PUBLIC_BOOKER_NUMBER_OF_DAYS_TO_LOAD=0
            NEXT_PUBLIC_INVALIDATE_AVAILABLE_SLOTS_ON_BOOKING_FORM=0
            NEXT_PUBLIC_QUICK_AVAILABILITY_ROLLOUT=10
            NEXT_PUBLIC_IS_PREMIUM_NEW_PLAN=0
            NEXT_PUBLIC_ORGANIZATIONS_MIN_SELF_SERVE_SEATS=30
            NEXT_PUBLIC_ORGANIZATIONS_SELF_SERVE_PRICE_NEW=37
            NEXT_PUBLIC_FORMBRICKS_HOST_URL=https://app.formbricks.com
            CALCOM_TELEMETRY_DISABLED=1
            MAX_OLD_SPACE_SIZE=6144
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            NEXTAUTH_SECRET=build-only
            CALENDSO_ENCRYPTION_KEY=build-only

  build-api:
    name: Build API v2 image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/v2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          # Used only by `prisma generate` during the build.
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            DATABASE_DIRECT_URL=postgresql://build:build@localhost:5432/build

  deploy:
    name: Deploy to Render
    needs: [build-web, build-api]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Web first: scripts/start.sh applies `prisma migrate deploy` before the
      # server listens, so the schema is current before the API serves traffic.
      - name: Deploy web
        env:
          SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          IMAGE: ${{ env.WEB_IMAGE }}:${{ github.sha }}
        run: .github/scripts/render-deploy.sh

      - name: Deploy API v2
        env:
          SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
          IMAGE: ${{ env.API_IMAGE }}:${{ github.sha }}
        run: .github/scripts/render-deploy.sh
